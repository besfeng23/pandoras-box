name: Canonical release evidence

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical source SHA to deploy if production deployment is explicitly enabled
        required: false
        type: string
      deploy_production:
        description: Deploy the exact source SHA to production (manual and opt-in only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: canonical-release-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-contract:
    name: canonical-release-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the checkout is exact and clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Use the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the source-only release contract
        run: node scripts/verify-canonical-release-evidence.mjs --mode repository

      - name: Run focused release-contract tests
        run: node --test test/canonical-release-evidence.test.js

      - name: Gate owner audit-to-build release journey
        run: node --test test/pandora-owner-journey-release-gate.test.js

      - name: Run the complete repository check
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run check

      - name: Run every repository test
        if: ${{ github.event_name != 'pull_request' }}
        run: npm test

      - name: Audit production dependencies
        if: ${{ github.event_name != 'pull_request' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check all governed Edge functions in isolation
        if: ${{ github.event_name != 'pull_request' }}
        run: npx --yes deno-bin@2.2.7 check --node-modules-dir=none --frozen supabase/functions/pandora-owner-api/index.ts supabase/functions/pandora-coordinator-gate/index.ts supabase/functions/pandora-worker-dispatch/index.ts supabase/functions/pandora-reviewer-attestation/index.ts supabase/functions/pandora-release-review-attestation/index.ts supabase/functions/pandora-release-owner-authorization/index.ts supabase/functions/pandora-physical-android-attestation/index.ts supabase/functions/mcpmaster-supabase-control/index.ts

      - name: Re-prove the checkout before binding it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Emit source-only SHA, tree, and migration binding
        run: >-
          node scripts/verify-canonical-release-evidence.mjs
          --mode source-binding
          --expected-sha "$EXPECTED_SOURCE_SHA"
          --output "${{ runner.temp }}/canonical-release-source-binding.json"

      - name: Upload the source-only binding
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-release-source-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-release-source-binding.json
          if-no-files-found: error
          retention-days: 30

      - name: Record private source-only binding
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          binding="${{ runner.temp }}/canonical-release-source-binding.json"
          test -s "$binding"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          binding_sha256="$(sha256sum "$binding" | cut -d ' ' -f1)"
          [[ "$binding_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'PANDORA_PRIVATE_SOURCE_BINDING source_sha=%s source_tree=%s binding_sha256=%s release_authority=false artifact_provider=unavailable\n' \
            "$source_sha" "$source_tree" "$binding_sha256"
          {
            echo '### Private source-binding receipt'
            echo "- Source SHA: $source_sha"
            echo "- Source tree: $source_tree"
            echo "- Binding SHA-256: $binding_sha256"
            echo '- Release authority: `false` (GitHub artifact provider unavailable)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm candidate CI did not mutate source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"


  edge_source_artifact:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          sha256sum \
            supabase/functions/pandora-project-runtime/index.ts \
            supabase/functions/pandora-project-source-generator/index.ts \
            supabase/functions/pandora-project-spec-compiler/index.ts \
            > edge-source-sha256.txt

      - name: Detect Edge source changes
        id: edge_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            supabase/functions/pandora-project-runtime/index.ts \
            supabase/functions/pandora-project-source-generator/index.ts \
            supabase/functions/pandora-project-spec-compiler/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record exact PR Edge source receipt
        if: ${{ github.event_name == 'pull_request' && steps.edge_changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          digest="$(sha256sum edge-source-sha256.txt | cut -d ' ' -f1)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'PANDORA_EDGE_PR_SOURCE_RECEIPT source_sha=%s source_tree=%s manifest_sha256=%s release_authority=false artifact_provider=deferred\n' \
            "$source_sha" "$source_tree" "$digest"
          {
            echo '### Pull-request Edge source receipt'
            echo "- Source SHA: `$source_sha`"
            echo "- Source tree: `$source_tree`"
            echo "- Manifest SHA-256: `$digest`"
            echo '- Release authority: `false`'
            echo '- Artifact provider: deferred to non-PR/release lane'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact Edge sources
        if: ${{ github.event_name != 'pull_request' && steps.edge_changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandora-edge-source-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            supabase/functions/pandora-project-runtime/index.ts
            supabase/functions/pandora-project-source-generator/index.ts
            supabase/functions/pandora-project-spec-compiler/index.ts
            edge-source-sha256.txt

      - name: Confirm no Edge source artifact is required
        if: ${{ steps.edge_changes.outputs.changed != 'true' }}
        run: echo "No governed Edge source changed in this pull request."


  deploy_prebuilt_production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true }}
    name: prebuilt-mcpmaster-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERCEL_ORG_ID: team_3yw1CN59ce4pj5SwyQGCAqN3
      VERCEL_PROJECT_ID: prj_Y5rZVcq8xJVzHVt4uvfmg9wPvXMk
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate exact source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact canonical source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Use repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pull production project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@59.10.0 pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build exact source on the GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.10.0 build \
            --prod \
            --token="$VERCEL_TOKEN"
          test -f .vercel/output/config.json

      - name: Deploy prebuilt output to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(
            npx --yes vercel@59.10.0 deploy \
              --prebuilt \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN"
          )"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and production alias
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --max-time 30 "$DEPLOYMENT_URL/health" > /tmp/deployment-health.json
          curl --fail --silent --show-error --location \
            --max-time 30 "https://mcpmaster.vercel.app/health" > /tmp/production-health.json
          printf 'deployment=%s\nsource_sha=%s\n' "$DEPLOYMENT_URL" "$SOURCE_SHA"
          cat /tmp/deployment-health.json
          printf '\n'
          cat /tmp/production-health.json
          printf '\n'

      - name: Record exact deployment evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo '### Task 146 prebuilt production deployment'
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Deployment: \`$DEPLOYMENT_URL\`"
            echo "- Production alias: \`https://mcpmaster.vercel.app\`"
          } >> "$GITHUB_STEP_SUMMARY"

